name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.19'
      - name: JavaScript syntax
        run: |
          node --check control/server.js
          node --check control/web/app.js
          node --check control/web/features.js
          node --check control/web/i18n.js
          node --check control/web/update-v101.js
      - name: Go build
        run: cd agent && go build ./...
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/install-phpmyadmin.sh scripts/upgrade.sh scripts/xshoter-updater.sh
      - name: PHP syntax
        run: php -l phpmyadmin/xshoter-sso.php

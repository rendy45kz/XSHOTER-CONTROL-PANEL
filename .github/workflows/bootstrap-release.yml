name: Bootstrap Release

on:
  push:
    paths:
      - '.github/workflows/bootstrap-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild audited release
        run: |
          cat .bootstrap/chunk* | base64 -d > /tmp/xshoter-control.tar.gz
          echo '07a331cc2cb3c1f123dd43965d7e1f13b04e5f79ef657f988c4cd49c21e41641  /tmp/xshoter-control.tar.gz' | sha256sum -c -
      - name: Publish release tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/xshoter-control.tar.gz -C .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish Xshoter Control v1.0.0'
          git push origin HEAD:main
